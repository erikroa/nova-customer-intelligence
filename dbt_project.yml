name: 'nova_customer_intelligence'
version: '1.0.0'

profile: 'nova_customer_intelligence'

model-paths: ['models']
analysis-paths: ['analyses']
test-paths: ['tests']
seed-paths: ['seeds']
macro-paths: ['macros']
snapshot-paths: ['snapshots']

clean-targets:
  - target
  - dbt_packages

models:
  nova_customer_intelligence:
    # BigQuery sandbox (no billing) rejects tables and views without an expiry under 60 days.
    # 1416 hours = 59 days. Remove this line if billing is enabled on the GCP project.
    +hours_to_expiration: 1416
    staging:
      +materialized: view
    marts:
      +materialized: table